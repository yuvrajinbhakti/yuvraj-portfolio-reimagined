    <style>
      body {
        background-color: #020617;
        color: white;
        margin: 0;
        padding: 0;
        overscroll-behavior: none; /* Prevent bouncing/multiple scrollbars */
      }
    
      html {
        background-color: #020617;
        overscroll-behavior: none;
      }
    
      #root {
        background-color: #020617;
        overscroll-behavior: none;
      }
    
      /* Loading state */
      .initial-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        background-color: #020617;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 9999;
      }
    
      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-left-color: #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
    
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Initial loading state that will be replaced by React -->
      <div class="initial-loading">
